<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>For You 💕</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap');

    :root {
      --cream: #FFF7F3;
      --blush: #FFDDE6;
      --blush-2: #FFB8D1;
      --rose: #F06595;
      --berry: #B82A54;
      --gold: #FFD166;
      --plum: #3E2434;
      --lavender: #D8CCF6;
      --card-bg: rgba(255, 255, 255, 0.82);
      --card-border: rgba(255, 184, 209, 0.5);
      --shadow: 0 14px 40px rgba(184, 42, 84, 0.16);
      --shadow-glow: 0 0 25px rgba(240, 101, 149, 0.25);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: linear-gradient(135deg, #FFF5F7 0%, #FFEDF3 50%, #F5ECFD 100%);
      font-family: 'Quicksand', sans-serif;
      color: var(--plum);
      touch-action: manipulation;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    h1,
    h2,
    h3 {
      font-family: 'Fredoka', sans-serif;
      margin: 0;
    }

    /* ---------- Ambient Background Layers ---------- */
    #bgHearts {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .bgheart {
      position: absolute;
      bottom: -40px;
      opacity: 0.6;
      animation: floatUp linear infinite;
      will-change: transform;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }

      10% {
        opacity: 0.6;
      }

      90% {
        opacity: 0.45;
      }

      100% {
        transform: translateY(-115vh) rotate(35deg);
        opacity: 0;
      }
    }

    #sparkleLayer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    .sparkle {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--gold);
      opacity: 0.7;
      animation: twinkle 2.4s ease-in-out infinite;
    }

    @keyframes twinkle {

      0%,
      100% {
        opacity: 0.15;
        transform: scale(0.5);
      }

      50% {
        opacity: 1;
        transform: scale(1.4);
      }
    }

    /* ---------- Cursor & Tap Effects ---------- */
    .trailheart {
      position: fixed;
      pointer-events: none;
      z-index: 80;
      font-size: 16px;
      will-change: transform, opacity;
    }

    .burstheart {
      position: fixed;
      pointer-events: none;
      z-index: 80;
      font-size: 18px;
      will-change: transform, opacity;
    }

    /* ---------- Progress Indicator ---------- */
    #progress {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 60;
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(8px);
      border-radius: 999px;
      border: 1px solid var(--card-border);
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: rgba(184, 42, 84, 0.2);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .dot.on {
      background: var(--berry);
      transform: scale(1.35);
      box-shadow: 0 0 8px rgba(184, 42, 84, 0.5);
    }

    /* ---------- Iris Transition Overlay ---------- */
    #iris {
      position: fixed;
      z-index: 70;
      border-radius: 50%;
      pointer-events: none;
      background: var(--berry);
      width: 0;
      height: 0;
      top: 0;
      left: 0;
      transform: translate(-50%, -50%);
    }

    /* ---------- Scenes Container & Glassmorphism Card ---------- */
    .scene {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3vh 3vw;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .scene.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 2px solid var(--card-border);
      border-radius: 28px;
      padding: 24px 26px;
      box-shadow: var(--shadow);
      width: min(92vw, 450px);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .glass-card-scroll {
      max-height: 88vh;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: var(--rose) transparent;
    }

    .glass-card-scroll::-webkit-scrollbar {
      width: 6px;
    }

    .glass-card-scroll::-webkit-scrollbar-thumb {
      background: var(--blush-2);
      border-radius: 999px;
    }

    .eyebrow {
      font-size: 0.82rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--rose);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .title {
      font-size: clamp(1.5rem, 5.2vw, 2.4rem);
      color: var(--berry);
      font-weight: 700;
      line-height: 1.2;
    }

    .subtitle {
      font-size: clamp(0.9rem, 2.8vw, 1.05rem);
      color: var(--plum);
      opacity: 0.82;
      margin-top: 6px;
      max-width: 380px;
      line-height: 1.45;
    }

    .hint-tap {
      font-size: 0.85rem;
      color: var(--rose);
      margin-top: 8px;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.3s;
    }

    /* ---------- Critter Character ---------- */
    .critter-wrap {
      width: 125px;
      height: 125px;
      margin: 10px auto;
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .eye {
      transform-origin: center;
    }

    .bubble {
      position: relative;
      background: #fff;
      border-radius: 18px;
      padding: 10px 16px;
      box-shadow: var(--shadow);
      font-size: 0.92rem;
      color: var(--berry);
      font-weight: 700;
      max-width: 280px;
      margin: 2px auto 8px;
      opacity: 0;
      transform: translateY(8px) scale(0.9);
      transition: all 0.35s cubic-bezier(.34, 1.56, .64, 1);
      border: 1.5px solid var(--blush);
    }

    .bubble.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .bubble::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: -8px;
      transform: translateX(-50%);
      border-width: 8px 8px 0 8px;
      border-style: solid;
      border-color: #fff transparent transparent transparent;
    }

    /* ---------- 3D Door Stage ---------- */
    .door-stage {
      width: 145px;
      height: 175px;
      margin: 10px auto 4px;
      position: relative;
      perspective: 700px;
    }

    .light-rays {
      position: absolute;
      inset: -35px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 209, 102, 0.65), transparent 68%);
      opacity: 0;
      z-index: 0;
      transition: opacity 0.5s;
    }

    .doorframe {
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, #F5B0C4, #E288A4);
      border-radius: 16px 16px 6px 6px;
      border: 3px solid #D16A8A;
      box-shadow: var(--shadow);
      z-index: 1;
    }

    .door {
      position: absolute;
      inset: 6px;
      background: linear-gradient(160deg, var(--berry), #8F1F3E);
      border-radius: 12px 12px 4px 4px;
      transform-origin: left center;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 14px;
      cursor: pointer;
      z-index: 2;
      border: 2px solid rgba(255, 255, 255, 0.25);
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.15);
    }

    .doorknob {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 0 3px rgba(255, 209, 102, 0.4), inset -2px -2px 2px rgba(0, 0, 0, 0.2);
    }

    .door-glow {
      box-shadow: 0 0 20px var(--gold), var(--shadow);
    }

    /* ---------- Password Form ---------- */
    .float-icon {
      position: absolute;
      font-size: 1.5rem;
      opacity: 0.6;
      animation: floatSlow 5s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes floatSlow {

      0%,
      100% {
        transform: translateY(0) rotate(-6deg);
      }

      50% {
        transform: translateY(-14px) rotate(6deg);
      }
    }

    .pw-form {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      position: relative;
      z-index: 2;
      width: 100%;
    }

    .pw-input {
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      text-align: center;
      padding: 13px 20px;
      border-radius: 999px;
      border: 2px solid var(--blush-2);
      background: rgba(255, 255, 255, 0.9);
      color: var(--berry);
      width: min(78vw, 270px);
      outline: none;
      letter-spacing: 0.05em;
      transition: all 0.25s;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.03);
    }

    .pw-input:focus {
      border-color: var(--rose);
      box-shadow: 0 0 0 5px rgba(240, 101, 149, 0.22), inset 0 2px 5px rgba(0, 0, 0, 0.03);
    }

    .pw-submit {
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      font-size: 1.05rem;
      color: #fff;
      background: linear-gradient(135deg, var(--rose), var(--berry));
      border: none;
      border-radius: 999px;
      padding: 12px 34px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(184, 42, 84, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .pw-submit:active {
      transform: scale(0.95);
    }

    .pw-msg {
      font-size: 0.9rem;
      color: #e74c3c;
      min-height: 22px;
      font-weight: 700;
      margin-top: 2px;
    }

    .pulse-btn {
      animation: pulseGlow 1.8s ease-in-out infinite;
    }

    @keyframes pulseGlow {

      0%,
      100% {
        box-shadow: 0 6px 20px rgba(240, 101, 149, 0.35);
        transform: scale(1);
      }

      50% {
        box-shadow: 0 10px 28px rgba(240, 101, 149, 0.6);
        transform: scale(1.04);
      }
    }

    /* ---------- Yes / No Interactive Stage ---------- */
    .yn-stage {
      position: relative;
      width: 100%;
      max-width: 400px;
      height: 200px;
      margin-top: 10px;
    }

    .yn-btn {
      position: absolute;
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      font-size: 1.15rem;
      border: none;
      border-radius: 999px;
      padding: 15px 38px;
      cursor: pointer;
      box-shadow: var(--shadow);
      white-space: nowrap;
      transition: background 0.2s, transform 0.15s;
    }

    .yn-yes {
      color: #fff;
      background: linear-gradient(135deg, var(--rose), var(--berry));
      left: 50%;
      top: 35%;
      transform: translate(-50%, -50%);
      box-shadow: 0 10px 25px rgba(240, 101, 149, 0.4);
    }

    .yn-no {
      color: var(--berry);
      background: #fff;
      border: 2.5px solid var(--blush-2);
      left: 50%;
      top: 75%;
      transform: translate(-50%, -50%);
    }

    /* ---------- Final Reveal & Polaroid Gallery ---------- */
    #musicToggle {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 60;
      border: 1.5px solid var(--blush);
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      box-shadow: var(--shadow);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      display: none;
      transition: transform 0.2s;
    }

    #musicToggle:active {
      transform: scale(0.9);
    }

    .final-msg {
      font-size: clamp(0.95rem, 3.2vw, 1.1rem);
      line-height: 1.65;
      color: var(--plum);
      max-width: 420px;
      margin: 8px 0 12px;
      font-weight: 600;
    }

    .final-msg .word {
      opacity: 0;
      display: inline-block;
      margin-right: 0.28em;
    }

    .gallery {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 420px;
      margin-top: 6px;
      margin-bottom: 10px;
    }

    .polaroid {
      width: 106px;
      height: 132px;
      perspective: 800px;
      cursor: pointer;
    }

    .polaroid-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(.34, 1.56, .64, 1);
    }

    .polaroid.flipped .polaroid-inner {
      transform: rotateY(180deg);
    }

    .polaroid-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      background: #fff;
      border-radius: 10px;
      box-shadow: var(--shadow);
      padding: 6px 6px 14px;
      border: 1px solid rgba(0, 0, 0, 0.05);
    }

    .polaroid-face::before {
      content: '';
      position: absolute;
      top: -7px;
      left: 50%;
      transform: translateX(-50%);
      width: 30px;
      height: 13px;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(0, 0, 0, 0.08);
      backdrop-filter: blur(4px);
      transform: translateX(-50%) rotate(-2deg);
    }

    .polaroid-back {
      transform: rotateY(180deg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      background: #FFF8FA;
    }

    .polaroid-img {
      width: 100%;
      height: 82px;
      border-radius: 6px;
      object-fit: cover;
      display: block;
      background: linear-gradient(135deg, var(--blush), var(--lavender));
    }

    .polaroid-cap {
      font-size: 0.64rem;
      text-align: center;
      color: var(--berry);
      margin-top: 5px;
      font-weight: 700;
    }

    .polaroid-note {
      font-size: 0.66rem;
      color: var(--berry);
      font-weight: 700;
      text-align: center;
      line-height: 1.35;
    }

    .final-heart {
      font-size: 2.3rem;
      margin-top: 2px;
      animation: heartbeat 1.3s ease-in-out infinite;
    }

    @keyframes heartbeat {

      0%,
      100% {
        transform: scale(1);
      }

      25% {
        transform: scale(1.22);
      }

      40% {
        transform: scale(1);
      }

      60% {
        transform: scale(1.14);
      }
    }

    .replay-btn {
      margin-top: 10px;
      margin-bottom: 6px;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--rose);
      background: none;
      border: none;
      text-decoration: underline;
      cursor: pointer;
      opacity: 0.85;
      transition: opacity 0.2s;
    }

    .replay-btn:hover {
      opacity: 1;
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="bgHearts"></div>
    <div id="sparkleLayer"></div>
    <div id="progress">
      <div class="dot" data-i="0"></div>
      <div class="dot" data-i="1"></div>
      <div class="dot" data-i="2"></div>
      <div class="dot" data-i="3"></div>
    </div>
    <button id="musicToggle" title="toggle audio ambience">🔈</button>

    <!-- SCENE 1: HOME -->
    <section class="scene active" id="scene-home">
      <div class="glass-card">
        <div class="eyebrow" id="homeEyebrow">tap to begin</div>
        <h1 class="title" id="homeTitle">Someone's outside your door...</h1>
        <p class="subtitle" id="homeSub">Tap the little critter to see who it is 👇</p>
        <div class="critter-wrap" id="critterHome"></div>
        <div class="bubble" id="bubbleHome">knock knock! 🚪</div>
        <div class="door-stage">
          <div class="light-rays" id="lightRays"></div>
          <div class="doorframe">
            <div class="door" id="door">
              <div class="doorknob"></div>
            </div>
          </div>
        </div>
        <div class="hint-tap" id="doorHint">now tap the door ✨</div>
      </div>
    </section>

    <!-- SCENE 2: PASSWORD -->
    <section class="scene" id="scene-password">
      <div class="glass-card">
        <div class="float-icon" style="top:8%; left:8%;">🔑</div>
        <div class="float-icon" style="top:12%; right:8%; animation-delay:1.2s;">🔒</div>
        <div class="float-icon" style="bottom:10%; left:6%; animation-delay:2.4s;">✨</div>
        <div class="eyebrow" id="pwEyebrow">one more step</div>
        <h1 class="title" id="pwTitle">What's the secret word?</h1>
        <p class="subtitle" id="pwSub">Only you would know this one 💗</p>
        <div class="critter-wrap" id="critterPw"></div>
        <div class="bubble" id="bubblePw"></div>

        <!-- Kiss Animation & Victory Flourish Container -->
        <div id="kissFlourish"
          style="display:none; flex-direction:column; align-items:center; justify-content:center; gap:16px; margin-top:12px; z-index:10; width:100%;">

          <div style="display:flex; flex-direction:row; align-items:center; justify-content:center; gap:14px;">
            <img id="kissImg1" src="kiss.webp" alt="kiss"
              style="width:112px; height:112px; object-fit:contain; border-radius:18px; filter:drop-shadow(0 6px 16px rgba(184,42,84,0.3)); border:2.5px solid var(--blush); transform-origin:center;">
            <img id="kissImg2" src="kiss2.webp" alt="kiss2"
              style="width:112px; height:112px; object-fit:contain; border-radius:18px; filter:drop-shadow(0 6px 16px rgba(184,42,84,0.3)); border:2.5px solid var(--blush); transform-origin:center;">
          </div>

          <button id="pwForwardBtn" class="pulse-btn"
            style="font-family:'Fredoka', sans-serif; font-size:1.05rem; font-weight:600; color:#fff; background:linear-gradient(135deg, var(--rose), var(--berry)); border:none; border-radius:999px; padding:13px 34px; cursor:pointer; margin-top:4px;">
            Wanna move forward? ✨
          </button>
        </div>

        <form class="pw-form" id="pwForm" autocomplete="off" action="#">
          <input class="pw-input" id="pwInput" type="text" placeholder="type here..." autocomplete="off"
            autocapitalize="off" spellcheck="false" enterkeyhint="done">
          <button class="pw-submit" type="submit" id="pwSubmitBtn">Unlock 🔓</button>
          <div class="pw-msg" id="pwMsg"></div>
        </form>
      </div>
    </section>

    <!-- SCENE 3: QUESTION -->
    <section class="scene" id="scene-question">
      <div class="glass-card">
        <div class="eyebrow">just checking</div>
        <h1 class="title">Do you love me?</h1>
        <p class="subtitle" id="qSub">Choose wisely 😏</p>

        <!-- Reaction Webp Container -->
        <div id="reactionWrap"
          style="height:90px; display:flex; align-items:center; justify-content:center; margin-top:6px;">
          <img id="reactionImg" src="sad.webp" alt="reaction"
            style="height:85px; width:auto; object-fit:contain; display:none; filter:drop-shadow(0 6px 14px rgba(184,42,84,0.22));">
        </div>

        <div class="yn-stage" id="ynStage">
          <button class="yn-btn yn-yes" id="btnYes">Yes 💖</button>
          <button class="yn-btn yn-no" id="btnNo">No</button>
        </div>
      </div>
    </section>

    <!-- SCENE 4: FINAL -->
    <section class="scene" id="scene-final">
      <div class="glass-card glass-card-scroll" style="width: min(92vw, 460px);">
        <div class="final-heart">💗</div>
        <h1 class="title" id="finalTitle">I knew it.</h1>

        <!-- Borderless "This is for you" + Cat with Bouquet Row -->
        <div class="for-you-row"
          style="display:flex; align-items:center; justify-content:space-between; width:100%; max-width:390px; margin: 12px 0 8px; padding: 12px 18px; background: rgba(255,255,255,0.68); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 24px; border: none; box-shadow: 0 8px 24px rgba(240, 101, 149, 0.12);">
          <div
            style="font-family:'Fredoka', sans-serif; font-size:1.2rem; color:var(--berry); font-weight:700; text-align:left; letter-spacing: -0.01em;">
            This is for you 💕
          </div>
          <img id="catImg" src="Cute Cat with Flower Bouquet.jpg" alt="Cute Cat"
            style="width:84px; height:84px; object-fit:cover; border-radius:18px; border: none; box-shadow: 0 8px 18px rgba(184,42,84,0.18);">
        </div>

        <div class="final-msg" id="finalMsg"></div>
        <div class="gallery" id="gallery"></div>
        <button class="replay-btn" id="replayBtn">↺ watch it again</button>
      </div>
    </section>
  </div>

  <div id="iris"></div>
  <canvas id="confettiCanvas"
    style="position:fixed;inset:0;z-index:75;pointer-events:none;width:100%;height:100%;"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.2/confetti.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    /* ============================================================
       CONFIG — personalize everything here.
       ============================================================ */
    const CONFIG = {
      herName: "My Love",
      password: "iloveyou",
      passwordHint: "Hint: three little words, all lowercase, no spaces, what i want to tell you. 💕",
      loveMessage:

    /* ============================================================
       Web Audio Sound FX (Synthesizer for cute chimes/pops)
       ============================================================ */
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playAudioFx(type) {
      try {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;

        if (type === 'pop') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, now);
          osc.frequency.exponentialRampToValueAtTime(180, now + 0.08);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.08);
        } else if (type === 'knock') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(140, now);
          osc.frequency.exponentialRampToValueAtTime(60, now + 0.06);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.06);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.06);
        } else if (type === 'unlock') {
          const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
          notes.forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0, now + i * 0.08);
            gain.gain.linearRampToValueAtTime(0.15, now + i * 0.08 + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.35);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(now + i * 0.08); osc.stop(now + i * 0.08 + 0.35);
          });
        } else if (type === 'wrong') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.linearRampToValueAtTime(130, now + 0.25);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.25);
        } else if (type === 'dodge') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(700, now + 0.12);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.12);
        }
      } catch (e) { }
    }

    /* ============================================================
       Ambient background: floating hearts + twinkling sparkles
       ============================================================ */
    (function ambient() {
      const wrap = document.getElementById('bgHearts');

    /* subtle parallax of ambient layers on mouse movement */
    document.addEventListener('mousemove', (e) => {

      const dy = (e.clientY / window.innerHeight - 0.5);

    /* ---- cursor heart trail ---- */
    let lastTrail = 0;
    document.addEventListener('mousemove', (e) => {
      const now = Date.now();
      if (now - lastTrail < 60) return;
      lastTrail = now;
      spawnFloatingGlyph(e.clientX, e.clientY, ['💗', '✨', '🌸'][Math.floor(Math.random() * 3)], 'trailheart');
    });
    function spawnFloatingGlyph(x, y, glyph, cls) {
      const el = document.createElement('div');
      el.className = cls;
      el.textContent = glyph;
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      document.body.appendChild(el);
      gsap.fromTo(el, { opacity: 0.95, scale: 0.6, y: 0 }, {
        opacity: 0, scale: 1.3, y: -35 - Math.random() * 20, duration: 0.9, ease: 'power1.out',
        onComplete: () => el.remove()
      });
    }
    function heartBurst(x, y, count) {
      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'burstheart';
        el.textContent = ['💗', '💕', '💖', '✨', '🌸'][Math.floor(Math.random() * 5)];
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        document.body.appendChild(el);
        const angle = Math.random() * Math.PI * 2;
        const dist = 45 + Math.random() * 65;
        gsap.fromTo(el, { opacity: 1, scale: 0.4, x: 0, y: 0 }, {
          opacity: 0, scale: 1.2, x: Math.cos(angle) * dist, y: Math.sin(angle) * dist - 20,
          duration: 0.85 + Math.random() * 0.4, ease: 'power2.out',
          onComplete: () => el.remove()
        });
      }
    }

    function critterHeartEyes(id, on) {
      const svg = document.getElementById(id);

      svg.querySelector('.eyes-heart').style.display = on ? '' : 'none';

    function critterFrown(id, on) {

    function critterTapPop(container) {
      playAudioFx('pop');
      gsap.fromTo(container, { scale: 1 }, { scale: 0.85, duration: 0.1, yoyo: true, repeat: 1, ease: 'power1.inOut' });
    }

    const critterHomeId = makeCritter(document.getElementById('critterHome'), '#F5A7BE');
    const critterPwId = makeCritter(document.getElementById('critterPw'), '#D8CCF6');

    /* ============================================================
       Scene Manager (Fixed Scene Hiding & Transition)
       ============================================================ */
    const sceneOrder = ['home', 'password', 'question', 'final'];
    const scenes = {
      home: document.getElementById('scene-home'),
      password: document.getElementById('scene-password'),
      question: document.getElementById('scene-question'),
      final: document.getElementById('scene-final'),
    };
    const dots = document.querySelectorAll('.dot');
    function updateDots(name) {
      const idx = sceneOrder.indexOf(name);
      dots.forEach((d, i) => d.classList.toggle('on', i <= idx));
    }
    updateDots('home');

    let isTransitioning = false;
    function goTo(name, originEvent) {
      if (isTransitioning) return;
      isTransitioning = true;

      const iris = document.getElementById('iris');
      let x = window.innerWidth / 2, y = window.innerHeight / 2;
      if (originEvent) {
        const pt = originEvent.touches ? originEvent.touches[0] : originEvent;
        if (pt && pt.clientX !== undefined) { x = pt.clientX; y = pt.clientY; }
      }
      const maxDist = Math.hypot(Math.max(x, window.innerWidth - x), Math.max(y, window.innerHeight - y)) * 2.4;
      iris.style.left = x + 'px'; iris.style.top = y + 'px';
      iris.style.width = '0px'; iris.style.height = '0px';

      gsap.to(iris, {
        width: maxDist, height: maxDist, duration: 0.5, ease: 'power2.in',
        onComplete: () => {
          // Explicitly hide all scenes and clear inline GSAP properties
          Object.values(scenes).forEach(s => {
            s.classList.remove('active');
            gsap.set(s, { clearProps: 'opacity,transform,visibility' });
          });

          const currentScene = scenes[name];
          currentScene.classList.add('active');
          updateDots(name);

          gsap.fromTo(currentScene,
            { opacity: 0, scale: 0.95 },
            {
              opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(1.2)',
              onComplete: () => {
                isTransitioning = false;
              }
            }
          );
          gsap.to(iris, { width: 0, height: 0, duration: 0.5, delay: 0.05, ease: 'power2.out' });
        }
      });
    }

    function burst(x, y) {
      if (typeof confetti !== 'function') return;
      confetti({ particleCount: 90, spread: 75, origin: { x, y }, colors: ['#F06595', '#FFD166', '#D8CCF6', '#B82A54', '#FFB8D1'] });
    }

    /* ================= SCENE 1: HOME ================= */
    const critterHomeEl = document.getElementById('critterHome');

    const doorEl = document.getElementById('door');

    const homeTitle = document.getElementById('homeTitle');

      // Swap critter SVG with hug.webp with gentle motion
      critterHomeEl.innerHTML = `<img id="hugImg" src="hug.webp" alt="hug" style="width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 6px 12px rgba(184,42,84,0.18));">`;

        .to(doorEl, { rotation: 0, duration: 0.08 })

        .to(doorEl, { rotation: 3, duration: 0.08 })

      playAudioFx('pop');
      gsap.to(doorEl, { rotateY: -108, duration: 0.75, ease: 'power2.inOut' });
      gsap.to(lightRays, { opacity: 1.4, scale: 1.4, duration: 0.75 });

    });

    /* ================= SCENE 2: PASSWORD ================= */
    const critterPwEl = document.getElementById('critterPw');
    const bubblePw = document.getElementById('bubblePw');
    const pwForm = document.getElementById('pwForm');
    const pwInput = document.getElementById('pwInput');
    const pwMsg = document.getElementById('pwMsg');
    const kissFlourish = document.getElementById('kissFlourish');

    let kissHeartInterval = null;

    critterPwEl.addEventListener('click', (e) => {
      critterTapPop(critterPwEl);
      heartBurst(e.clientX, e.clientY, 6);
      bubblePw.textContent = CONFIG.passwordHint;
      bubblePw.classList.toggle('show');

    let pwChecking = false;
    function checkPassword(e) {
      if (pwChecking || isTransitioning) return;
      pwChecking = true;
      pwInput.blur(); // Dismiss mobile keyboard cleanly

      const val = pwInput.value.replace(/\s+/g, '').toLowerCase();
      const target = CONFIG.password.replace(/\s+/g, '').toLowerCase();

      if (val === target) {
        playAudioFx('unlock');
        burst(0.5, 0.4);
        const rect = pwInput.getBoundingClientRect();
        heartBurst(rect.left + rect.width / 2, rect.top, 16);

        // Update Title to "You guessed the secret! 💖"

        // Remove / Hide: Eyebrow, Subtitle, Critter Image, Bubble, Form

        const pwSub = document.getElementById('pwSub');
        const critterPw = document.getElementById('critterPw');
        const bubblePw = document.getElementById('bubblePw');

        if (pwEyebrow) pwEyebrow.style.display = 'none';
        if (pwSub) pwSub.style.display = 'none';
        if (critterPw) critterPw.style.display = 'none';
        if (bubblePw) bubblePw.style.display = 'none';
        pwForm.style.display = 'none';

        // Display Kiss Flourish directly below the new heading
        if (kissFlourish) {

          const kiss2 = document.getElementById('kissImg2');

          gsap.fromTo(kissFlourish,
            { scale: 0.8, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.5, ease: 'back.out(1.6)' }
          );

          // Active Kissing Motion Animation

          gsap.to(kiss2, { x: -14, rotation: -8, duration: 0.65, repeat: -1, yoyo: true, ease: 'sine.inOut' });

            if (kissFlourish && kissFlourish.style.display !== 'none') {

              heartBurst(r.left + r.width / 2, r.top + r.height / 2 - 15, 4);

      } else {
        playAudioFx('wrong');
        pwMsg.style.color = '#e74c3c';

    pwForm.addEventListener('submit', (e) => {

    /* ================= SCENE 3: YES / NO ================= */
    const ynStage = document.getElementById('ynStage');

    const btnNo = document.getElementById('btnNo');
    const qSub = document.getElementById('qSub');
    const reactionImgEl = document.getElementById('reactionImg');
    const reactionImages = ['angry1.webp', 'sad.webp', 'sad2.webp', 'sad3.webp', 'lovebite.webp'];
    let lastReactionIndex = -1;
    const noTaunts = ["No", "Nice try 😏", "Nope!", "Not happening", "Try again?", "Missed me!", "So close 😉", "Nuh uh 💖"];
    let dodgeCount = 0;

    function stageRect() { return ynStage.getBoundingClientRect(); }

    function moveNoButton() {
      playAudioFx('dodge');

      // Random reaction image on No dodge
      let randIdx;
      do {
        randIdx = Math.floor(Math.random() * reactionImages.length);
      } while (randIdx === lastReactionIndex && reactionImages.length > 1);
      lastReactionIndex = randIdx;

      if (reactionImgEl) {
        reactionImgEl.src = reactionImages[randIdx];
        reactionImgEl.style.display = 'block';
        gsap.fromTo(reactionImgEl,
          { scale: 0.3, opacity: 0, rotation: Math.random() * 24 - 12 },
          { scale: 1, opacity: 1, rotation: 0, duration: 0.35, ease: 'back.out(2)' }
        );
      }

      const rect = stageRect();
      const btnW = btnNo.offsetWidth, btnH = btnNo.offsetHeight;
      const padX = btnW / 2 + 8, padY = btnH / 2 + 8;
      const maxX = Math.max(rect.width - padX, padX);
      const maxY = Math.max(rect.height - padY, padY);
      let x, y, tries = 0;
      do {
        x = padX + Math.random() * (maxX - padX);
        y = padY + Math.random() * (maxY - padY);
        tries++;
      } while (Math.hypot(x - rect.width * 0.5, y - rect.height * 0.35) < 80 && tries < 12);

      dodgeCount++;
      btnNo.textContent = noTaunts[Math.min(dodgeCount, noTaunts.length - 1)];
      gsap.to(btnNo, { left: x, top: y, rotation: (Math.random() * 36 - 18), duration: 0.4, ease: 'back.out(1.8)' });
      gsap.fromTo(btnYes, { scale: 1 + Math.min(dodgeCount - 1, 10) * 0.03 }, { scale: 1 + Math.min(dodgeCount, 10) * 0.03, duration: 0.3, ease: 'back.out(2)' });
    }

    btnNo.addEventListener('touchstart', (e) => { e.preventDefault(); moveNoButton(); }, { passive: false });
    btnNo.addEventListener('mouseenter', moveNoButton);
    btnNo.addEventListener('pointerdown', (e) => { e.preventDefault(); moveNoButton(); });
    btnNo.addEventListener('click', (e) => { e.preventDefault(); moveNoButton(); });

    const finalMsgEl = document.getElementById('finalMsg');
    const finalTitleEl = document.getElementById('finalTitle');

    btnYes.addEventListener('click', (e) => {
      if (isTransitioning) return;
      playAudioFx('unlock');
      burst(0.3, 0.5); burst(0.7, 0.5);
      heartBurst(e.clientX, e.clientY, 16);
      finalTitleEl.textContent = "I knew it. 💗";
      buildFinal();
      setTimeout(() => goTo('final', e), 400);

    new MutationObserver(() => {
      if (scenes.question.classList.contains('active')) {

          const rect = stageRect();
          gsap.set(btnNo, { left: rect.width * 0.5, top: rect.height * 0.75, rotation: 0 });

    /* ================= SCENE 4: FINAL ================= */

      const words = msg.split(/\s+/);
      finalMsgEl.innerHTML = words.map(w => `<span class="word">${w}</span>`).join(' ');
      gsap.to('#finalMsg .word', { opacity: 1, duration: 0.35, stagger: 0.04, ease: 'power1.out', delay: 0.25 });

      const catImg = document.getElementById('catImg');
      if (catImg) {
        gsap.to(catImg, { y: -6, rotation: 3, duration: 1.6, repeat: -1, yoyo: true, ease: 'sine.inOut', transformOrigin: 'center' });
      }

      const gallery = document.getElementById('gallery');
      gallery.innerHTML = '';
      const items = (CONFIG.photos && CONFIG.photos.length) ? CONFIG.photos : [
        { src: "couple1.webp", caption: "us 💕", note: "a moment I'll keep forever" },
        { src: "couple2.webp", caption: "together ✨", note: "my favorite kind of day" },
        { src: "couple3.webp", caption: "happy days 💖", note: "you bring me so much joy" },
        { src: "couple0.webp", caption: "my love 💗", note: "my favorite person" }
      ];

      items.forEach((p, i) => {
        const card = document.createElement('div');
        card.className = 'polaroid';
        const imgHtml = `<img class="polaroid-img" src="${p.src}" alt="${p.caption || ''}" onerror="this.outerHTML='<div class=\\'polaroid-img\\' style=\\'display:flex;align-items:center;justify-content:center;font-size:1.6rem;\\'>💗</div>'">`;
        card.innerHTML = `
      <div class="polaroid-inner">
        <div class="polaroid-face">${imgHtml}<div class="polaroid-cap">${p.caption || ''}</div></div>
        <div class="polaroid-face polaroid-back"><div class="polaroid-note">${p.note || 'tap to flip back'}</div></div>
      </div>`;
        card.addEventListener('click', () => {
          playAudioFx('pop');
          card.classList.toggle('flipped');
        });
        gallery.appendChild(card);
        gsap.fromTo(card, { opacity: 0, y: 24, rotationY: -90 }, { opacity: 1, y: 0, rotationY: 0, duration: 0.55, delay: 0.85 + i * 0.12, ease: 'back.out(1.6)' });
      });
    }

    /* replay button reset */
    document.getElementById('replayBtn').addEventListener('click', (e) => {
      if (isTransitioning) return;
      playAudioFx('pop');
      knocked = false; doorTapped = false; pwChecking = false;
      doorEl.classList.remove('door-glow');
      gsap.set(doorEl, { rotateY: 0 });
      gsap.set(lightRays, { opacity: 0, scale: 1 });
      bubbleHome.classList.remove('show');
      homeTitle.textContent = "Someone's outside your door...";
      homeSub.textContent = "Tap the little critter to see who it is 👇";
      doorHint.style.opacity = '0';

      // Reset Password Scene Layout
      const pwTitle = document.getElementById('pwTitle');
      const pwEyebrow = document.getElementById('pwEyebrow');
      const pwSub = document.getElementById('pwSub');
      const critterPw = document.getElementById('critterPw');

      if (pwTitle) pwTitle.textContent = "What's the secret word?";
      if (pwEyebrow) pwEyebrow.style.display = 'block';
      if (pwSub) pwSub.style.display = 'block';
      if (critterPw) critterPw.style.display = 'flex';

      pwInput.value = ''; pwMsg.textContent = '';
      pwForm.style.display = 'flex';
      if (kissFlourish) kissFlourish.style.display = 'none';
      if (kissHeartInterval) clearInterval(kissHeartInterval);
      if (reactionImgEl) reactionImgEl.style.display = 'none';

      const kiss1 = document.getElementById('kissImg1');
      const kiss2 = document.getElementById('kissImg2');
      if (kiss1 && kiss2) {
        gsap.killTweensOf([kiss1, kiss2]);
        gsap.set([kiss1, kiss2], { clearProps: 'x,rotation,transform' });
      }

      critterHeartEyes(critterPwId, false);
      critterHeartEyes(critterHomeId, false);

      // Reset critterHomeEl to SVG critter
      makeCritter(document.getElementById('critterHome'), '#F5A7BE');

      goTo('home', e);
    });

    /* ambient background synth tone toggle */
    let ambientNodes = [], musicOn = false;
    const musicBtn = document.getElementById('musicToggle');
    new MutationObserver(() => { if (scenes.final.classList.contains('active')) musicBtn.style.display = 'block'; })
      .observe(scenes.final, { attributes: true, attributeFilter: ['class'] });

    musicBtn.addEventListener('click', () => {
      const ctx = getAudioCtx();
      if (musicOn) {
        ambientNodes.forEach(n => n.stop());
        ambientNodes = [];
        musicOn = false; musicBtn.textContent = '🔈';
        return;
      }
      const notes = [523.25, 659.25, 783.99, 987.77];
      const master = ctx.createGain();
      master.gain.value = 0.04;
      master.connect(ctx.destination);
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = freq;
        const g = ctx.createGain();
        g.gain.value = 0;
        osc.connect(g); g.connect(master);
        osc.start();
        gsap.to(g.gain, { value: 0.45, duration: 1.6, delay: i * 0.4, repeat: -1, yoyo: true, ease: 'sine.inOut' });
        ambientNodes.push(osc);
      });
      musicOn = true; musicBtn.textContent = '🔊';
    });
  </script>
</body>

</html>
